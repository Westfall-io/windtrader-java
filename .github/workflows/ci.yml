name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Ensure SYML_GITHUB_TOKEN is set
        run: |
          if [ -z "${{ secrets.SYML_GITHUB_TOKEN }}" ]; then
            echo "Missing required secret SYML_GITHUB_TOKEN"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

          # Creates ~/.m2/settings.xml server credentials for GitHub Packages (Maven)
          # Must match the <id> in your pom.xml repo: <id>sysml-github</id>
          server-id: sysml-github
          server-username: MAVEN_GITHUB_USERNAME
          server-password: MAVEN_GITHUB_TOKEN

      - name: Build (Maven)
        env:
          MAVEN_GITHUB_USERNAME: ${{ github.actor }}
          MAVEN_GITHUB_TOKEN: ${{ secrets.SYML_GITHUB_TOKEN }}
        run: mvn -q -DskipTests=true clean package

      - name: Pick runnable jar
        shell: bash
        run: |
          set -euo pipefail
          # Shade typically creates target/original-*.jar + target/*.jar
          JAR="$(ls -1 target/*.jar | grep -v '^target/original-' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "Could not find shaded runnable jar in target/"
            ls -lh target || true
            exit 1
          fi
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          echo "Using $JAR"

      - name: Smoke test - valid syntax should exit 0
        run: |
          echo "part Stage_1 { attribute mass; }" | java -jar "$JAR" check

      - name: Smoke test - invalid keyword should exit 2
        run: |
          set +e
          echo "part { attrib mass; }" | java -jar "$JAR" check
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected exit code 2, got $code"
            exit 1
          fi

      - name: Smoke test - echo prints something
        run: |
          out="$(echo "part Stage_1 { attribute mass; }" | java -jar "$JAR" echo)"
          if [ -z "$out" ]; then
            echo "Expected non-empty echo output"
            exit 1
          fi

      - name: Smoke test - export emits an API-shaped JSON graph (bundled stdlib)
        run: |
          # export must load the bundled SysML standard library from the jar,
          # then emit parseable JSON: a list of element records with @id/@type.
          out="$(echo "part def P;" | java -jar "$JAR" export)"
          if [ -z "$out" ]; then
            echo "Expected non-empty export JSON"
            exit 1
          fi
          echo "$out" | python3 -c "import sys,json; d=json.load(sys.stdin); assert isinstance(d,list) and d, 'expected non-empty JSON list'; p=d[0].get('payload',{}); assert p.get('@id') and p.get('@type'), 'missing @id/@type'"

      - name: Smoke test - invalid export input exits 2 (not 0)
        run: |
          # A failed export must not silently exit 0 (would mask failures for
          # downstream consumers). Invalid syntax on stdin -> exit 2.
          set +e
          echo "part { attrib mass; }" | java -jar "$JAR" export >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected export exit code 2 for invalid input, got $code"
            exit 1
          fi

      - name: Smoke test - export fails loudly (exit 3) when stdlib is unavailable
        run: |
          # Export without the standard library must FAIL LOUDLY (exit 3), not
          # silently exit 0 with an empty/partial result. Points the library at a
          # nonexistent dir so the bundle override path is exercised.
          set +e
          echo "part def P;" | WINDTRADER_SYSML_LIBRARY=/nonexistent-windtrader-lib java -jar "$JAR" export >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "Expected export exit code 3 when stdlib unavailable, got $code"
            exit 1
          fi

      - name: Smoke test - unit expression in feature value (issue #4 regression)
        run: |
          echo "part Stage_1 { attribute mass = 1000 [kg]; }" | java -jar "$JAR" check

      - name: Smoke test - excluded pilot classes resolve at runtime
        # The pom excludes the pilot's internal bundle artifacts (model.bundle,
        # logic.bundle, sysml, plantuml) and relies on the -all uberjar shading them.
        # Verify representative classes still resolve so a shading gap fails the build.
        run: |
          cat > /tmp/RTProbe.java <<'EOF'
          public class RTProbe {
            public static void main(String[] a) throws Exception {
              Class.forName(a[0]);
              System.out.println("OK " + a[0]);
            }
          }
          EOF
          javac -d /tmp /tmp/RTProbe.java
          for c in \
            org.omg.sysml.model.Branch \
            org.omg.sysml.logic.SysMLLogicStandaloneSetup \
            org.omg.sysml.plantuml.SysML2PlantUMLLinkProvider; do
            java -cp "/tmp:$JAR" RTProbe "$c"
          done

      - name: Corpus test - upstream SysML v2 examples all parse (exit 0)
        shell: bash
        run: |
          set -euo pipefail
          # With the pilot pinned to 0.62.0, ALL upstream examples must parse AND
          # round-trip (parse -> echo -> re-parse). The former 0.60.0 grammar-gap
          # skip-list was removed — any regression fails.
          fails=0; total=0
          while IFS= read -r f; do
            rel="${f#src/test/resources/upstream/}"
            total=$((total+1))
            if ! java -jar "$JAR" check < "$f" >/dev/null 2>/tmp/wt-corpus.err; then
              echo "FAIL(parse): $rel"
              grep -vE 'SLF4J|log4j|^\[|^WARNING|^INFO|at ' /tmp/wt-corpus.err | head -2 || true
              fails=$((fails+1))
              continue
            fi
            # Round-trip leg 1: echo must emit parseable text that re-parses clean.
            if ! java -jar "$JAR" echo < "$f" >/tmp/wt-echo.sysml 2>/tmp/wt-echo.err \
               || [ ! -s /tmp/wt-echo.sysml ]; then
              echo "FAIL(echo): $rel"
              grep -vE 'SLF4J|log4j|^\[|^WARNING|^INFO|at ' /tmp/wt-echo.err | head -2 || true
              fails=$((fails+1))
              continue
            fi
            if ! java -jar "$JAR" check < /tmp/wt-echo.sysml >/dev/null 2>/tmp/wt-roundtrip.err; then
              echo "FAIL(re-parse): $rel"
              grep -vE 'SLF4J|log4j|^\[|^WARNING|^INFO|at ' /tmp/wt-roundtrip.err | head -2 || true
              fails=$((fails+1))
              continue
            fi
            # Round-trip leg 2: idempotence — echo(echo(x)) must be byte-identical
            # to echo(x). Catches progressive loss or unstable output.
            if ! java -jar "$JAR" echo < /tmp/wt-echo.sysml >/tmp/wt-echo2.sysml 2>/dev/null \
               || ! cmp -s /tmp/wt-echo.sysml /tmp/wt-echo2.sysml; then
              echo "FAIL(not idempotent): $rel"
              fails=$((fails+1))
            fi
          done < <(find src/test/resources/upstream -name '*.sysml' | sort)
          echo "Corpus complete. $total files, $fails failed."
          # Assert the corpus is complete — a broken/empty path must not pass silently.
          if [ "$total" -ne 96 ]; then
            echo "Expected 96 corpus files, found $total (corpus may be incomplete)"
            exit 1
          fi
          if [ "$fails" -gt 0 ]; then exit 1; fi

      - name: Corpus test - export JSON shape matches golden manifest
        shell: bash
        run: |
          set -euo pipefail
          # The export subcommand must reproduce the normalized-shape golden manifest
          # (element count + @type multiset + internal dangling-ref count per corpus
          # file). UUIDs are fresh per parse so byte-golden is impossible; the shape
          # IS deterministic. This catches dropped @type, broken references, or a
          # regression in the fixture set.
          #
          # The comparator and its committed generator live in scripts/ so the golden
          # is reproducible (scripts/generate-export-golden.sh), not hand-edited.
          python3 scripts/check-export-golden.py

      - name: Cross-path check - single-file export shape equals batch-export
        shell: bash
        run: |
          set -euo pipefail
          # The single-file `export` path and the shared-ResourceSet `batch-export`
          # path must produce the IDENTICAL normalized shape for the same corpus file
          # (element count + @type multiset). This is the sentinel for the latent
          # shared-ResourceSet URI-collision risk in batch-export: if a future corpus
          # file ever diverges between the two paths, this step fails loudly.
          # The previous step (check-export-golden.py) already ran batch-export, which
          # produced <source>.export.json next to each fixture; we compare one file's
          # single-file export against that batch output.
          F="src/test/resources/upstream/Simple-Tests/CalculationTest.sysml"
          java -jar "$JAR" export < "$F" > /tmp/xp-single.json 2>/dev/null
          python3 - <<'PY'
          import json, collections, sys
          def shape(p):
              d = json.load(open(p))
              c = collections.Counter(el.get("payload", {}).get("@type","?") for el in d)
              return len(d), dict(sorted(c.items()))
          single = shape("/tmp/xp-single.json")
          batch = shape("src/test/resources/upstream/Simple-Tests/CalculationTest.sysml.export.json")
          ok = single == batch
          print(f"single-file export count={single[0]} batch count={batch[0]} type-multiset-match={single[1]==batch[1]} overall={ok}")
          if not ok:
              print("FAIL: single-file export diverges from batch-export shape (shared-ResourceSet contamination?)")
              sys.exit(1)
          print("cross-path check: single-file export shape equals batch-export")
          PY


      - name: Upload jar artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: windtrader-java-jar
          if-no-files-found: warn
          path: ${{ env.JAR }}
